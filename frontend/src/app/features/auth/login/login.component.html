<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Plateforme de Dédouanement</h2>
      <p>Connectez-vous à votre compte</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      
      <div class="form-group">
        <label for="email">Email :</label>
        <input 
          type="email" 
          id="email"
          formControlName="email"
          class="form-control"
          [class.is-invalid]="f['email'].invalid && f['email'].touched"
          placeholder="votre.email@exemple.com"
        />
        
        <div *ngIf="f['email'].invalid && f['email'].touched" class="invalid-feedback">
          <div *ngIf="f['email'].errors?.['required']">L'email est obligatoire</div>
          <div *ngIf="f['email'].errors?.['email']">Veuillez saisir un email valide</div>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input 
          type="password" 
          id="password"
          formControlName="password"
          class="form-control"
          [class.is-invalid]="f['password'].invalid && f['password'].touched"
          placeholder="••••••••"
        />
        
        <div *ngIf="f['password'].invalid && f['password'].touched" class="invalid-feedback">
          <div *ngIf="f['password'].errors?.['required']">Le mot de passe est obligatoire</div>
          <div *ngIf="f['password'].errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</div>
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button 
        type="submit" 
        class="btn btn-primary btn-block"
        [disabled]="loginForm.invalid || isLoading"
      >
        <span *ngIf="isLoading" class="spinner"></span>
        {{ isLoading ? 'Connexion...' : 'Se connecter' }}
      </button>

      <div class="register-link">
        <p>Pas encore de compte ? 
          <a routerLink="/register" class="link">Créer un compte</a>
        </p>
      </div>
    </form>
  </div>
</div>
